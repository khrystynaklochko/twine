<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; color: #0f172a; background: #fafafa; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { font-size: 12px; color: #475569; margin: 0 0 10px; }
      label { display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; margin-top: 3px; }
      button { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #1e3a8a; color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 6px; font-size: 12px; }
      button.secondary { background: #fff; color: #0f172a; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      pre { font-size: 11px; background: #f1f5f9; padding: 8px; border-radius: 6px; max-height: 110px; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>TwinMe Teach Mode</h1>
    <p id="site-label">Detecting active site...</p>
    <label>
      TwinMe Studio URL
      <input id="studio-url" placeholder="https://... or http://localhost:3000" />
    </label>
    <label>
      Your Twin Owner ID
      <input id="owner-id" placeholder="Paste Owner ID from /teach" />
    </label>
    <button id="save-cfg-btn" class="secondary">Save Studio Connection</button>
    <button id="toggle-btn">Enable Teach Mode on This Site</button>
    <button id="open-teach-btn" class="secondary">Open TwinMe Teach Review</button>
    <pre id="status">Idle — configure URL & Owner ID, then enable on an approved site.</pre>
    <script src="popup.js"></script>
  </body>
</html>
